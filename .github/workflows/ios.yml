name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: TabViewAndRouting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT_Token }}@github.com/".insteadOf "https://github.com/"

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
        working-directory: '.'

      - name: Install Ruby gems
        run: |
          gem install bundler
          bundle install

      - name: Run tests
        run: bundle exec fastlane ios test
