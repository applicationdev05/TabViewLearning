name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: TabViewAndRouting
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # No explicit Xcode select – runner's default is the latest stable Xcode
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            TabViewAndRouting/.build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('TabViewAndRouting/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Install Ruby gems
        run: |
          gem install bundler
          bundle install

      - name: Run tests
        timeout-minutes: 45
        run: bundle exec fastlane ios test
