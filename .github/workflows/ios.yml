name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: TabViewAndRouting
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Clear old SPM caches (prevent hang)
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf TabViewAndRouting/.build

      - name: Install Ruby gems
        run: |
          gem install bundler
          bundle install

      - name: Run tests
        timeout-minutes: 80
        run: bundle exec fastlane ios test
