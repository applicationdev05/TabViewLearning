name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: TabViewRouting   # All "run" steps will use this directory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
        # This step doesn't need the working-directory, so override it
        working-directory: '.'

      - name: Setup Ruby and install gems
        working-directory: TabViewRouting
        run: |
          gem install bundler
          bundle install

      - name: Run tests
        run: bundle exec fastlane ios test
        # This will automatically use the working-directory from defaults
