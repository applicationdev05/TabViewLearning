name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: TabViewAndRouting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby gems
        run: |
          gem install bundler
          bundle install

      - name: Run tests
        run: bundle exec fastlane ios test
