name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: TabViewAndRouting   # Correct folder name
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app
        working-directory: '.'

      - name: Install Ruby gems
        run: |
          gem install bundler
          bundle install

      - name: Run tests
        run: bundle exec fastlane ios test
