name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120   # base timeout in seconds
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 3     # optional, default is 4

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: TabViewAndRouting
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby gems
        run: |
          gem install bundler
          bundle install

      - name: Run tests
        run: bundle exec fastlane ios test
