# Disable problematic rules
disabled_rules:
  - empty_enum_arguments

# IMPORTANT: Disable all analyzer rules to avoid SourceKit
analyzer_rules: []

# Enable safe opt-in rules
opt_in_rules:
  - empty_count
  - empty_string

# Paths to exclude
excluded:
  - Carthage
  - Pods
  - SwiftLint/Common/3rdPartyLib
  - DerivedData
  - .build

# Line length
line_length:
  warning: 150
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

# Function body length
function_body_length:
  warning: 300
  error: 500

# Function parameters
function_parameter_count:
  warning: 6
  error: 8

# Type body length
type_body_length:
  warning: 300
  error: 500

# File length
file_length:
  warning: 1000
  error: 1500
  ignore_comment_only_lines: true

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 15
  error: 25

# Reporter
reporter: "xcode"

# Custom paths
included:
  - TabViewAndRouting
